      <stop offset="0" stop-color="#6E5A33"/><stop offset=".12" stop-color="#B99A58"/>
      <stop offset=".4" stop-color="#E2C88C"/><stop offset=".66" stop-color="#C0A262"/>
      <stop offset=".9" stop-color="#7E6738"/><stop offset="1" stop-color="#5C4A28"/>
