<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img">
  <defs>
    <filter id="esh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
